name: build-android

on:
  push:
    branches: [ master ]
    # Path filters are not evaluated for tag pushes (GitHub Actions always runs
    # the workflow for a matching tag regardless of `paths`), so adding `tags`
    # here doesn't need its own trigger block: a `vX.Y.Z` tag always triggers a
    # release build + publish, an ordinary commit to master only runs when it
    # touches these paths.
    tags: [ 'v*.*.*' ]
    paths:
      - 'src/podofo/**'
      - 'src/wrapper/**'
      - 'src/android/**'
      - 'scripts/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/podofo/**'
      - 'src/wrapper/**'
      - 'src/android/**'
      - 'scripts/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      publish_version:
        description: 'Version to (re-)publish to GitHub Packages, eg. 1.2.3 (leave empty for a normal, non-publishing build)'
        required: false

permissions:
  contents: write  # only needed to create the GitHub Release for a tag push
  packages: write  # only needed to publish to GitHub Packages

env:
  # nttld/setup-ndk downloads from dl.google.com using Google's "rXXy" release
  # name, not the numeric package revision (27.2.12479018) reported by
  # `sdkmanager`/`source.properties` for the same release.
  # https://github.com/android/ndk/releases#release-r27d
  NDK_VERSION: r27c

jobs:
  build-android-aar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # A `vX.Y.Z` tag push is the only source of a release version — nothing
      # is ever committed to gradle.properties. A workflow_dispatch run with
      # publish_version set re-publishes that exact version without needing a
      # new tag (eg. retrying after a Maven Central/Packages outage).
      - name: Determine release version
        id: release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.publish_version }}" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.publish_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install native dependency build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config rsync build-essential

      # Speeds up recompiles of unchanged sources across runs — most valuable for
      # PoDoFo itself, whose build.sh isn't gated by the dependency cache below
      # and does a fresh `rsync` of the source tree every run (resets file mtimes,
      # defeating CMake/ninja's own incremental rebuild even when content matches).
      # scripts/android/common.sh wires CC/CXX (or ANDROID_CCACHE/CMAKE_*_LAUNCHER
      # for CMake-based dependencies) through ccache whenever it's on PATH.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk-${{ env.NDK_VERSION }}
          max-size: 2G

      # Building all 8 native dependencies for all 4 ABIs from source is the
      # slowest part of this pipeline (~40-90 min cold). Cache it, keyed on
      # the scripts that produce it (any version bump or fix invalidates the
      # cache automatically) and the NDK version (a toolchain change should
      # rebuild everything too).
      - name: Cache Android native dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: build/android
          key: android-deps-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/android/**') }}

      - name: Build native dependencies (brotli, bzip2, freetype, libpng, libxml2, openssl, harfbuzz, zlib)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: scripts/android/build_deps.sh "$ANDROID_NDK_HOME" build/android

      - name: Cross-compile PoDoFo for Android (all 4 ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          scripts/android/podofo/build.sh "$ANDROID_NDK_HOME" build/android/podofo \
              build/android/freetype/install build/android/libpng/install \
              build/android/libxml2/install build/android/openssl/install

      - name: Organize native libs for linking
        run: |
          scripts/android/podofo-aar/organize_libs.sh \
              build/android/brotli/install build/android/bzip2/install \
              build/android/freetype/install build/android/harfbuzz/install \
              build/android/libpng/install build/android/libxml2/install \
              build/android/openssl/install build/android/podofo/install \
              build/android/zlib/install build/android/aar

      - name: Link JNI shared library per ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: scripts/android/podofo-aar/build.sh "$ANDROID_NDK_HOME" src/wrapper build/android/aar

      - name: Copy native libs into jniLibs
        run: |
          mkdir -p src/android/src/main/jniLibs
          cp -r build/android/aar/build/jni/* src/android/src/main/jniLibs/

      - name: Verify JNI symbols survived
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D \
              src/android/src/main/jniLibs/arm64-v8a/libpodofo.so | grep Java_com_podofo_android

      - name: Build AAR
        working-directory: src/android
        run: |
          if [ "${{ steps.release.outputs.is_release }}" = "true" ]; then
            ./gradlew build -Pversion="${{ steps.release.outputs.version }}"
          else
            ./gradlew build
          fi

      - name: Verify AAR contents
        run: |
          for aar in src/android/build/outputs/aar/*.aar; do
            echo "=== $aar ==="
            unzip -l "$aar" | grep -E '\.so$|classes\.jar'
          done

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: podofo-android-aar
          path: src/android/build/outputs/aar/*.aar

      - name: Publish to GitHub Packages
        if: steps.release.outputs.is_release == 'true'
        working-directory: src/android
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        # RELEASE_SIGNING_ENABLED=true in gradle.properties is meant for the
        # Maven Central path (mavenPublishing {}): Gradle's signing plugin ties
        # signing to the publication, not the destination repository, so
        # without this override `signMavenPublication` fails here for lack of a
        # configured GPG key — GitHub Packages doesn't require signed artifacts.
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository \
              -Pversion="${{ steps.release.outputs.version }}" \
              -PRELEASE_SIGNING_ENABLED=false

      # Only for an actual tag push, not a workflow_dispatch re-publish of an
      # already-released version — otherwise re-running the dispatch input
      # would try (and fail) to create a duplicate release for the same tag.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # AGP's default output names (*-release.aar/*-debug.aar) have no
          # version in them at all. Renamed copies here follow Maven/ivy-style
          # <module>-<version>[-<classifier>].aar naming so consumers can
          # resolve these directly as a Gradle dependency via an ivy-pattern
          # repository pointed at GitHub Releases (see README_extended.md),
          # instead of only being a manual-download link.
          VERSION="${{ steps.release.outputs.version }}"
          MODULE="leiacare-lib-android-podofo"  # must match rootProject.name in src/android/settings.gradle.kts
          mkdir -p release-assets
          cp "src/android/build/outputs/aar/${MODULE}-release.aar" "release-assets/${MODULE}-${VERSION}.aar"
          cp "src/android/build/outputs/aar/${MODULE}-debug.aar" "release-assets/${MODULE}-${VERSION}-debug.aar"
          gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              release-assets/*.aar
